name: SHMails
version: '${project.version}'
main: org.Cry_Legende.sHMails.SHMails
api-version: '1.20'
author: Cry_Legende
# ViaVersion : version du client pour la réponse par dialogue. SHNetwork est facultatif : sans lui, les mails restent
# dans le stockage de ce serveur comme avant.
softdepend: [ViaVersion, SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (mails en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  mail:
    description: Ouvre votre boîte aux lettres ou envoie un mail à un joueur.
    usage: /mail [joueur] [message]
    aliases: [mails]
  shmails:
    description: Administration de SHMails (view, spy, clear, import, reload). Sans droit d'administration, se comporte comme /mail.
    usage: /shmails <view|spy|clear|import|reload> [args]
    aliases: [shmailadmin, shma]

permissions:
  shmails.use:
    description: Permet d'utiliser les fonctionnalités de base des mails (ouvrir la boîte).
    default: true
  shmails.send:
    description: Permet d'envoyer des mails.
    default: true
  shmails.admin:
    description: Toutes les sous-commandes d'administration de /shmails.
    default: op
    children:
      shmails.admin.view: true
      shmails.admin.view.interact: true
      shmails.admin.spy: true
      shmails.admin.reload: true
      shmails.admin.clear: true
      shmails.admin.import: true
  shmails.admin.view:
    description: Permet de voir les mails d'un autre joueur (/shmails view).
    default: op
  shmails.admin.view.interact:
    description: Permet d'interagir (répondre/supprimer) avec les mails lors de la visualisation admin.
    default: op
  shmails.admin.spy:
    description: Permet d'espionner les mails envoyés (/shmails spy).
    default: op
  shmails.admin.reload:
    description: Permet de recharger la configuration du plugin (/shmails reload).
    default: op
  shmails.admin.clear:
    description: Permet de supprimer les mails d'un joueur via commande admin (/shmails clear).
    default: op
  shmails.admin.import:
    description: Mode réseau, permet de reprendre en base partagée les mails de ce serveur (/shmails import).
    default: op
