# ======================================================================== #
# SHMails
#
# Plugin : boîte aux lettres en jeu. Un joueur écrit à un autre, connecté ou non, qui retrouve ses mails dans un menu,
# peut y répondre ou les supprimer ; une notification est envoyée à la connexion et à chaque nouveau mail. Avec
# SHNetwork, les boîtes sont dans une base partagée et un mail arrive où que soit le destinataire (voir la section
# 'reseau' en bas du fichier).
#
# Commandes :
#   /mail                         Ouvre votre boîte (alias : /mails).
#   /mail <joueur> <message>      Envoie un mail.
#   /shmails view <joueur>        Consulte la boîte d'un joueur (alias de /shmails : /shmailadmin, /shma).
#   /shmails clear <joueur>       Supprime tous les mails d'un joueur.
#   /shmails spy                  Active ou coupe l'espionnage des mails envoyés.
#   /shmails reload               Recharge config.yml et messages.yml.
#   /shmails import               Mode réseau : reprend en base les mails et espions de ce serveur (une fois).
# /shmails est la racine d'administration. Sans aucun droit d'administration, il se comporte comme /mail.
# Les messages sont dans messages.yml ; ce fichier garde les réglages, les sons, le menu et les dialogues.
#
# Permissions :
#   shmails.use, shmails.send                        Ouvrir sa boîte, envoyer un mail (par défaut : tous).
#   shmails.admin                                    Toutes les sous-commandes de /shmails (op par défaut).
#   shmails.admin.view, .spy, .clear, .import, .reload   Une par sous-commande (op par défaut).
#   shmails.admin.view.interact                      Répondre ou supprimer dans une boîte consultée avec view (op).
#
# Un reload valide config.yml et messages.yml avant de les appliquer : si l'un est invalide, rien ne change et le
# message donne le fichier et l'erreur. Il ne touche ni aux mails ni à spies.yml. Demande un redémarrage :
# storage_type et la section reseau.
#
# ======================================================================== #

# SHMails Configuration v1.2.0

# Préfixe utilisé dans les messages du plugin
plugin_prefix: ""

# Paramètres généraux
max_mails_per_player: 30 # Nombre maximum de mails qu'un joueur peut avoir (0 pour infini)
login_notification_delay_ticks: 60 # Délai en ticks (20 ticks = 1 seconde) avant d'afficher la notification des mails reçus
max_message_line_length: 35 # Longueur maximale d'une ligne de message dans le lore de l'item
date_format: "dd/MM/yyyy 'à' HH:mm"

# Stockage des données
# Type de stockage: "yaml" ou "sqlite"
storage_type: "sqlite"

# Configuration des sons
sounds:
  mail_sent: "ENTITY_PLAYER_LEVELUP;1.0;1.2"
  mail_received: "ENTITY_EXPERIENCE_ORB_PICKUP;1.0;1.0"
  mail_deleted: "ENTITY_ITEM_BREAK;1.0;0.8"
  reply_mode_enter: "BLOCK_NOTE_BLOCK_PLING;1.0;1.5"
  reply_mode_cancel: "BLOCK_NOTE_BLOCK_PLING;1.0;0.8"
  gui_open: "BLOCK_CHEST_OPEN;1.0;1.0"
  gui_close: "BLOCK_CHEST_CLOSE;1.0;1.0"
  gui_click_button: "UI_BUTTON_CLICK;1.0;1.0"
  gui_click_mail: "UI_BUTTON_CLICK;1.0;1.2"
  action_error: "BLOCK_ANVIL_LAND;1.0;0.8"

# Réponse à un mail par dialogue natif (clients 1.21.6 et plus), à la place de « tapez votre message dans le chat ».
# Les clients plus anciens (ou actif: false) gardent le mode réponse par chat, inchangé (« cancel » pour annuler).
# Variables : %sender% (auteur du mail) %date% %message% (texte du mail, affiché tel quel) %max% (longueur maximale).
# Codes & et &#RRGGBB acceptés. Les messages envoyés dans le chat (envoyé, annulé, expiré...) restent dans messages.yml.
dialogues:
  # false : tous les joueurs répondent dans le chat
  actif: true
  # Version de protocole minimale du client pour recevoir un dialogue (771 = 1.21.6).
  # Sans ViaVersion, tous les clients sont considérés compatibles.
  min-protocol: 771
  # Durée de validité d'un dialogue ouvert, en secondes : passé ce délai, envoyer ne fait plus rien
  expiration-secondes: 300
  reponse:
    titre: "&#F9C572&lRépondre à &e&l%sender%"
    corps:
      - "&7Mail reçu le &e%date%"
      - ""
      - "&f%message%"
    champ: "&fVotre réponse &7(%max% caractères maximum)"
    envoyer: "&a&lEnvoyer"
    annuler: "&c&lAnnuler"
    erreurs:
      vide: "&cLa réponse ne peut pas être vide."
      invalide: "&cRéponse invalide : %max% caractères maximum, sans caractère spécial."

# Configuration du GUI de la boîte mail
gui:
  title: "&8&lMenu &8| Mails (%page%/%max_pages%)"
  size: 54
  mail_slots: "11-15,20-24,29-33"

  mail_item:
    material: "WRITABLE_BOOK"
    name: "&7Mail de &e%sender%"
    lore:
      - "&8Reçu le %date%"
      - ""
      - "%message%"
      - ""
      - "&7&o(( &e&oClic Gauche &7&opour &e&oRépondre &7&o))"
      - "&7&o(( &c&oClic Droit &7&opour &c&oSupprimer &7&o))"

  previous_page_item:
    slot: 48
    material: "ARROW"
    name: "&aPage Précédente"
    lore:
      - "&7Aller à la page %previous_page%"
  next_page_item:
    slot: 50
    material: "ARROW"
    name: "&aPage Suivante"
    lore:
      - "&7Aller à la page %next_page%"
  close_item:
    slot: 49
    material: "PAPER" # Changé de BARRIER à PAPER pour variété, peut être ce que vous voulez
    name: "&cFermer"
    lore:
      - ""
      - "&7&o(( &c&oCliquez &7&opour fermer le menu &8&o))"
  delete_all_mails_item:
    enabled: true
    slot: 45
    material: "LAVA_BUCKET"
    name: "&cSupprimer tous les mails"
    lore:
      - "&4ᴀᴄᴛɪᴏɴ ɪʀʀᴇᴠᴇʀѕɪʙʟᴇ."
      - ""
      - "&7Supprimer l'ensemble de vos mails."
      - ""
      - "&7&o(( &c&oCliquez pour supprimer vos mails &8&o))"

  # Nouveau bouton d'information
  info_button_item:
    enabled: true
    slot: 53 # En bas à droite pour un GUI de 54 slots (index 0-53)
    material: "KNOWLEDGE_BOOK" # KNOWLEDGE_BOOK, WRITABLE_BOOK ou SIGN sont aussi de bonnes options
    name: "&eInformations Utiles"
    lore:
      - ""
      - "&7Pour envoyer un mail :"
      - "&e  /mail <NomDuJoueur> <VotreMessage>"
      - ""
      - "&7&l« &f&lUtilité des mails &8&l»"
      - "&8• &eContacter &7un &ejoueur &7lorsqu'il"
      - "&7est &ehors ligne&7."
      - ""
      - "&8• &7Laisser des &emessages importants"
      - "&7que les joueurs verront à leur &econnexion&7."
      - ""

  filler_item:
    enabled: true
    material: "BLACK_STAINED_GLASS_PANE"
    name: " "

# Mode réseau. Actif seulement si SHNetwork est installé et 'actif' vaut true : les mails et les espions sont alors
# dans la base partagée (tables shmails_mails, shmails_boxes, shmails_spies) au lieu du stockage ci-dessus, et un mail
# est remis au destinataire sur le serveur où il se trouve. Sans SHNetwork, rien de ceci n'est utilisé.
# Demande un redémarrage. Les mails et espions existants sont repris avec /shmails import.
reseau:
  actif: true
  # Durée maximale, en secondes, pendant laquelle on attend que l'autre serveur ait fini de sauvegarder
  # le joueur avant de lire sa boîte
  attente-max-secondes: 10
  # Sujet du bus SHNetwork qui prévient les serveurs d'un nouveau mail ou d'une boîte modifiée
  canal: shmails
  # Registre des premières connexions (tenu par SHPlayerTrack) : un destinataire jamais venu sur ce serveur y est
  # cherché avant d'être déclaré introuvable. Vide pour ne pas le consulter.
  table-premieres-connexions: "Global.sh_track_firstseen"
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/bo_net"
    utilisateur: shmails
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes. Une base qui ne répond pas
    # fait échouer l'ouverture de la boîte et l'envoi d'un mail (message d'erreur).
    delai-ms: 3000
