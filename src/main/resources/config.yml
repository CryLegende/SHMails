# Configuration du GUI de la boîte mail
gui:
  title: "&8&lMenu &8| Mails (%page%/%max_pages%)"
  size: 54
  mail_slots: "11-15,20-24,29-33"

  mail_item:
    material: "WRITABLE_BOOK"
    name: "&7Mail de &e%sender%"
    lore:
      - "&8Reçu le %date%"
      - ""
      - "%message%"
      - ""
      - "&7&o(( &e&oClic Gauche &7&opour &e&oRépondre &7&o))"
      - "&7&o(( &c&oClic Droit &7&opour &c&oSupprimer &7&o))"

  previous_page_item:
    slot: 48
    material: "ARROW"
    name: "&aPage Précédente"
    lore:
      - "&7Aller à la page %previous_page%"
  next_page_item:
    slot: 50
    material: "ARROW"
    name: "&aPage Suivante"
    lore:
      - "&7Aller à la page %next_page%"
  close_item:
    slot: 49
    material: "PAPER" # Changé de BARRIER à PAPER pour variété, peut être ce que vous voulez
    name: "&cFermer"
    lore:
      - ""
      - "&7&o(( &c&oCliquez &7&opour fermer le menu &8&o))"
  delete_all_mails_item:
    enabled: true
    slot: 45
    material: "LAVA_BUCKET"
    name: "&cSupprimer tous les mails"
    lore:
      - "&4ᴀᴄᴛɪᴏɴ ɪʀʀᴇᴠᴇʀѕɪʙʟᴇ."
      - ""
      - "&7Supprimer l'ensemble de vos mails."
      - ""
      - "&7&o(( &c&oCliquez pour supprimer vos mails &8&o))"

  # Nouveau bouton d'information
  info_button_item:
    enabled: true
    slot: 53 # En bas à droite pour un GUI de 54 slots (index 0-53)
    material: "KNOWLEDGE_BOOK" # KNOWLEDGE_BOOK, WRITABLE_BOOK ou SIGN sont aussi de bonnes options
    name: "&eInformations Utiles"
    lore:
      - ""
      - "&7Pour envoyer un mail :"
      - "&e  /mail <NomDuJoueur> <VotreMessage>"
      - ""
      - "&7&l« &f&lUtilité des mails &8&l»"
      - "&8• &eContacter &7un &ejoueur &7lorsqu'il"
      - "&7est &ehors ligne&7."
      - ""
      - "&8• &7Laisser des &emessages importants"
      - "&7que les joueurs verront à leur &econnexion&7."
      - ""

  filler_item:
    enabled: true
    material: "BLACK_STAINED_GLASS_PANE"
    name: " "